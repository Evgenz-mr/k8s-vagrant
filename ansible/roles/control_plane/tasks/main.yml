---
- name: Initialize control plane
  command: kubeadm init --apiserver-advertise-address={{ ansible_host }} --pod-network-cidr={{ pod_cidr }}
  args:
    creates: /etc/kubernetes/admin.conf

- name: Configure kubectl for vagrant
  shell: |
    mkdir -p /home/vagrant/.kube
    cp /etc/kubernetes/admin.conf /home/vagrant/.kube/config
    chown -R vagrant:vagrant /home/vagrant/.kube
  args:
    creates: /home/vagrant/.kube/config

- name: Install Flannel CNI
  become_user: vagrant
  command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  register: flannel
  changed_when: "'created' in flannel.stdout or 'configured' in flannel.stdout"

- name: Generate join command
  command: kubeadm token create --print-join-command
  register: join_command
  changed_when: false

- name: Save join command to shared directory
  copy:
    content: "{{ join_command.stdout }}\n"
    dest: /vagrant/join-command.sh
    mode: '0755'
